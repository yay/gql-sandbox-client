query getUsers {
	users {
		id
		email
		firstName
		lastName
		score
	}
}

query getUser($id: ID!) {
	users(id: $id) {
		...NameParts
		email
	}
}

query getUserInlineFragment($id: ID!) {
	users(id: $id) {
		... on User {
			firstName
			lastName
		}
		email
	}
}

fragment NameParts on User {
	firstName
	lastName
}

query getUsersConnection(
	$first: Int
	$after: String
	$last: Int
	$before: String
) {
	usersConnection(first: $first, after: $after, last: $last, before: $before) {
		edges {
			cursor
			node {
				id
				email
				firstName
				lastName
				score
			}
		}
		pageInfo {
			endCursor
			hasNextPage
			hasPreviousPage
			startCursor
		}
	}
}

mutation createUser($input: CreateUserInput!) {
	createUser(input: $input) {
		id
		email
		firstName
		lastName
	}
}

mutation updateUser($input: UpdateUserInput!) {
	updateUser(input: $input) {
		id
		firstName
		lastName
	}
}

mutation deleteUser($id: ID!) {
	deleteUser(id: $id)
}

subscription scoreChanged($id: ID) {
	scoreChanged(userId: $id) {
		id
		score
	}
}
